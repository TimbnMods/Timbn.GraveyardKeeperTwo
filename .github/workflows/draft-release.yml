# Drafts a GitHub release for each mod a change touched, when its current version has a CHANGELOG.md section and
# no tag yet. A push to main covers that push. A manual run covers the last merged PR, or the mods named.
# A draft made here triggers nothing. Attach the Release DLL to it, then run the Release drafts workflow.
name: Draft releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mods:
        description: Mods to draft instead of the last merged PR, separated by spaces (chestlabels core)
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: draft-releases

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Draft or update a release per changed mod
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          MODS: ${{ inputs.mods }}
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A brand new branch reports an all zero before, so fall back to the pushed commit alone.
            if [ -z "${BEFORE//0/}" ]; then
              BEFORE="$GITHUB_SHA~1"
            fi
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"
          elif [ -z "$MODS" ]; then
            pr=$(gh pr list --state merged --base main --limit 30 --json number,mergedAt,mergeCommit --jq 'max_by(.mergedAt)')
            target=$(jq -r .mergeCommit.oid <<< "$pr")
            echo "Drafting from PR #$(jq -r .number <<< "$pr") (merge commit $target)" >> "$GITHUB_STEP_SUMMARY"
            git checkout -q "$target"
            git diff --name-only "$target^1" "$target" > "$RUNNER_TEMP/changed.txt"
          fi

          dotnet run tools/release/Release.cs -- list > "$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/existing.json"

          jq -c '.[]' "$RUNNER_TEMP/releases.json" | while read -r release; do
            project=$(jq -r .project <<< "$release")
            mod=$(jq -r '.mod | ascii_downcase' <<< "$release")
            tag=$(jq -r .tag <<< "$release")
            title=$(jq -r .title <<< "$release")

            if [ -n "$MODS" ]; then
              [[ " ${MODS,,} " == *" $mod "* ]] || continue
            else
              grep -q "^src/$project/" "$RUNNER_TEMP/changed.txt" || continue
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag is already released" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            dotnet run tools/release/Release.cs -- notes "$project" > "$RUNNER_TEMP/notes.md"
            draft=$(jq -s --arg tag "$tag" '[.[][] | select(.draft and .tag_name == $tag)][0].id // empty' "$RUNNER_TEMP/existing.json")

            if [ -n "$draft" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$draft" \
                -f tag_name="$tag" -f target_commitish="$target" -f name="$title" -F body=@"$RUNNER_TEMP/notes.md" > /dev/null
              echo "Updated the $tag draft" >> "$GITHUB_STEP_SUMMARY"
            else
              gh release create "$tag" --draft --target "$target" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
              echo "Drafted $tag" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
