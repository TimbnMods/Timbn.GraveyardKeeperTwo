summary: Retired. Graveyard Keeper 2 1.012 added a campfire bench rest at the Keeper's house, so this mod does nothing and can be removed.
banner: images/header.jpg
sections:
  - title: Retired
    text: Graveyard Keeper 2 1.012 added a campfire bench by the campfire at the Keeper's house. It passes time and restores energy, so this mod is no longer needed. Version 1.5.0 turns the mod off for anyone who still has it, and it can be removed.

  - title: Requirements

  - title: Installation
    only: [nexus]
    blocks:
      - subtitle: With Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2
          - Install Timbn Core
          - Download with "Mod Manager Download" from the Files tab
      - subtitle: Without Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2, start the game once, and quit at the main menu
          - Install Timbn Core
          - Extract the Timbn.GraveyardKeeperTwo.CampfireMeditation zip into BepInEx/plugins
      - text: Start the game and open Mod Settings on the main menu. The mod is listed there under Timbn Mods.

  - title: Installation
    only: [steam]
    olist:
      - Install BepInEx for Graveyard Keeper 2
      - Subscribe to Timbn Core and to this item
      - Start the game and open Mod Settings on the main menu. The mod is listed there under Timbn Mods.

  - title: Troubleshooting
    text: If a game update changes something a Timbn mod relies on, that mod stays off instead of running half broken, and BepInEx/LogOutput.log says which part failed. Include the startup line from that log when reporting a problem.
