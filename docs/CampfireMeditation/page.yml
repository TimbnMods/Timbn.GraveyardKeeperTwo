summary: Sit by the campfire at home and pass the time, like the stone garden in the first game. Time runs faster while you slowly get energy back.
banner: images/header.jpg
sections:
  - title: How It Works
    list:
      - Stand by the campfire at your home and a `Meditate` hint appears above it
      - Press interact and the screen fades to black and back, with you facing the fire
      - The world goes dark, so only the fire and the lamps around it light the scene, day or night
      - Time runs 7 times faster, so a day passes in about 43 seconds, and the world carries on at that speed
      - You slowly get energy back, a quarter of what sleep gives
      - Your insanity slowly goes down too, by up to 20 each time you meditate, the same as a night's sleep
      - Press interact again on `Wake Up` to fade back to normal
    image: images/meditating.jpg

  - title: Settings
    list:
      - How fast time runs while you meditate (`Meditation / TimeSpeed`, 1 to 50, default 7, sleep runs at 50)
      - How much energy you get back per day of meditating (`Meditation / EnergyPerDay`, 0 to 400, default 100, sleep gives 400)
      - How much insanity goes away per day of meditating (`Meditation / InsanityPerDay`, 0 to 400, default 40)
      - The most insanity one meditation can take away (`Meditation / MaxInsanity`, 0 to 100, default 20, sleep takes 20)
      - How close to a campfire you have to stand (`Meditation / Radius`, default 2)
      - Only the campfire at your home works (`Meditation / HomeOnly`, on by default). Turn it off to meditate at any campfire in the world.

  - title: Good To Know
    list:
      - Works with rebound keys and controllers
      - If something else you can use is in reach, like a chest or a person to talk to, that comes first and the hint stays hidden
      - You can't meditate while you're tired, and meditating ends by itself if you get tired
      - While you sit you can't walk, use tools or open menus
      - The game does not save while you meditate
      - Going back to the main menu ends a meditation in progress
      - Nothing is added to your save, so you can remove the mod at any time

  - title: Requirements

  - title: Installation
    only: [nexus]
    blocks:
      - subtitle: With Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2
          - Install Timbn Core
          - Download with "Mod Manager Download" from the Files tab
      - subtitle: Without Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2, start the game once, and quit at the main menu
          - Install Timbn Core
          - Extract the Timbn.GraveyardKeeperTwo.CampfireMeditation zip into BepInEx/plugins
      - text: Timbn Core and Timbn Campfire Meditation show at the bottom right of the main menu once they're installed.

  - title: Installation
    only: [steam]
    olist:
      - Install BepInEx for Graveyard Keeper 2 and Timbn Workshop Sync
      - Subscribe to Timbn Core and to this item
      - Start the game. Timbn Core and Timbn Campfire Meditation show at the bottom right of the main menu once they're installed.

  - title: Translating
    text: Every line the mod shows is in `lang/en.txt` inside its folder. Copy it to your game's language, such as `lang/de.txt`, `lang/fr.txt` or `lang/pt-br.txt`, and translate the text after each `=`. Anything left out shows in English.

  - title: Troubleshooting
    text: If a game update changes something a Timbn mod relies on, that mod stays off instead of running half broken, and BepInEx/LogOutput.log says which part failed. Include the startup line from that log when reporting a problem.
