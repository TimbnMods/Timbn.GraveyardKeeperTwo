summary: The shared framework every Timbn mod for Graveyard Keeper 2 is built on. Install it when a Timbn mod needs it. On its own it adds a Mod Settings window for your mods.
sections:
  - title: Requirements

  - title: Installation
    only: [nexus]
    blocks:
      - subtitle: With Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2
          - Download with "Mod Manager Download" from the Files tab
      - subtitle: Without Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2, start the game once, and quit at the main menu
          - Extract the Timbn.GraveyardKeeperTwo.Core zip into BepInEx/plugins
      - text: Once it's installed, Timbn Core shows at the bottom right of the main menu.

  - title: Installation
    only: [steam]
    olist:
      - Install BepInEx for Graveyard Keeper 2 and Timbn Workshop Sync
      - Subscribe to this item
      - Start the game. Timbn Core shows at the bottom right of the main menu once it's installed.

  - title: Mod Settings
    text: A Mod Settings button sits under the game's own Settings button, on the main menu and in the pause menu. It opens a window that lists all your mods with their settings, and a Timbn mod can add its links and pages of its own. It works with a mouse or a controller.

  - title: For Modders
    text: Start with the [Timbn.GraveyardKeeperTwo.Templates](https://www.nuget.org/packages/Timbn.GraveyardKeeperTwo.Templates) template, or add the [Timbn.GraveyardKeeperTwo.Core](https://www.nuget.org/packages/Timbn.GraveyardKeeperTwo.Core) NuGet package to your project. The [API docs](https://timbnmods.github.io/) and the [source](https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo) are on GitHub.

  - title: Troubleshooting
    text: If a game update changes something Timbn Core relies on, the part that broke stays off instead of running half broken, and BepInEx/LogOutput.log says which part failed. Include the startup line from that log when reporting a problem.
