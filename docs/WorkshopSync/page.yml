summary: This mod is retired. The game now installs Workshop mods itself. This final version moves your Workshop mods over to the game and turns itself off.
banner: images/header.jpg
sections:
  - title: How It Works
    text: |
      From game version 1.011 the game installs BepInEx mods from the Workshop on its own, but it leaves that off while Workshop Sync is installed. Update to this version and start the game once.
    list:
      - Your installed Workshop mods move to `BepInEx/plugins` and load on that same start.
      - Workshop Sync then turns itself off and the game takes over from there.
      - Your settings stay as they are.

  - title: Good To Know
    list:
      - A file named `Timbn.GraveyardKeeperTwo.WorkshopSync.dll.retired` stays in `BepInEx/patchers`. You can delete it, or uninstall the mod.
      - You can also skip this update and delete the mod from `BepInEx/patchers` yourself. Workshop mods it installed then stay in `BepInEx/plugins/Workshop` until you delete that folder.
      - The old settings do nothing now.

  - title: Requirements

  - title: Installation
    only: [nexus]
    blocks:
      - subtitle: With Vortex
      - olist:
          - Download with "Mod Manager Download" from the Files tab
          - Start the game once
      - subtitle: Without Vortex
      - olist:
          - Extract the Timbn.GraveyardKeeperTwo.WorkshopSync zip into your Graveyard Keeper 2 folder, so the mod lands in BepInEx/patchers (not plugins)
          - Start the game once
      - text: When it works, BepInEx/LogOutput.log has a line saying Workshop Sync turned itself off.

  - title: Troubleshooting
    text: BepInEx/LogOutput.log says what moved and any problem it hit. Include it when reporting a problem.
