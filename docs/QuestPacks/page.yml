summary: Adds quests and talks written as plain JSON files, no code needed. Install it for any quest pack, or for a mod that ships one.
banner: images/header.jpg
sections:
  - title: How It Works
    list:
      - A quest pack is a folder anywhere in `BepInEx/plugins` with a `pack.json` and a `quests` folder. Its quests show up in the game like any other.
      - A mod can ship a `quests` folder next to its DLL, and those quests come and go with the mod.
      - Edit a standalone pack while the game runs, and it's read again the next time you're back on the main menu.
      - Mistakes in a pack file are written to the log, and the rest of the pack still loads.

  - title: Settings
    list:
      - Show a popup on the main menu listing mistakes found in quest pack files (`General / ShowProblemsOnMainMenu`, off by default)

  - title: Requirements

  - title: Installation
    only: [nexus]
    blocks:
      - subtitle: With Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2
          - Install Timbn Core
          - Download with "Mod Manager Download" from the Files tab
      - subtitle: Without Vortex
      - olist:
          - Install BepInEx for Graveyard Keeper 2, start the game once, and quit at the main menu
          - Install Timbn Core
          - Extract the Timbn.GraveyardKeeperTwo.QuestPacks zip into BepInEx/plugins
      - text: Timbn Core and Timbn Quest Packs show at the bottom right of the main menu when it works.

  - title: Installation
    only: [steam]
    olist:
      - Install BepInEx for Graveyard Keeper 2 and Timbn Workshop Sync
      - Subscribe to Timbn Core and to this item
      - Start the game. Timbn Core and Timbn Quest Packs show at the bottom right of the main menu when it works.

  - title: Troubleshooting
    text: If a game update changes something a Timbn mod relies on, that mod stays off instead of running half broken, and BepInEx/LogOutput.log says which part failed. Include the startup line from that log when reporting a problem.
